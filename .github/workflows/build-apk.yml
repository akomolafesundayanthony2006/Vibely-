name: Build Vibely APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Check Vibely ZIP
        run: |
          test -f Vibely_v3_Fresh.zip

      - name: Extract Vibely project
        run: |
          rm -rf project
          mkdir project
          unzip -q Vibely_v3_Fresh.zip -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Build APK
        working-directory: project
        run: gradle clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vibely-final-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
