name: Build Vibely APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract Vibely project
        run: |
          unzip -o Vibely_Phone_Build.zip -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Force Java and Kotlin to JVM 17
        working-directory: project
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.vibely.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.vibely.app"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.activity:activity-ktx:1.10.0")
          }
          EOF

          echo "===== FINAL BUILD CONFIGURATION ====="
          cat app/build.gradle.kts

      - name: Install Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Clean project
        working-directory: project
        run: |
          gradle clean --no-daemon

      - name: Build Vibely APK
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload Vibely APK
        uses: actions/upload-artifact@v4
        with:
          name: Vibely-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
