name: Build Vibely APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Find and extract Vibely project
        run: |
          ZIP_FILE=$(find . -name "Vibely_v2_Search_Profile.zip" -type f | head -1)
          echo "Found ZIP: $ZIP_FILE"
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -type f | head -1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" -name "app-debug.apk" -type f | head -1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "APK found at: $APK"

      - name: Upload Vibely APK
        uses: actions/upload-artifact@v4
        with:
          name: Vibely-apk-v2
          path: ${{ env.APK }}
