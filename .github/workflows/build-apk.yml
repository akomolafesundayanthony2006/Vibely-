name: Build Vibely APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract Vibely project
        run: unzip -o Vibely_v2_Search_Profile.zip -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Build APK
        working-directory: project/vibely_work
        run: gradle clean assembleDebug --no-daemon

      - name: Upload Vibely APK
        uses: actions/upload-artifact@v4
        with:
          name: Vibely-apk-v2
          path: project/vibely_work/app/build/outputs/apk/debug/app-debug.apk
