name: Build Vibely APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract Vibely project
        run: |
          unzip -o Vibely_Phone_Build.zip -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Fix Java and Kotlin JVM targets
        working-directory: project
        run: |
          echo "Checking Gradle configuration..."
          cat app/build.gradle.kts

          echo "Fixing Java 8 targets..."
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle.kts
          sed -i 's/JavaVersion.VERSION_8/JavaVersion.VERSION_17/g' app/build.gradle.kts
          sed -i 's/jvmTarget *= *"1\.8"/jvmTarget = "17"/g' app/build.gradle.kts
          sed -i 's/jvmTarget *= *"8"/jvmTarget = "17"/g' app/build.gradle.kts

          echo "Final Gradle configuration:"
          cat app/build.gradle.kts

      - name: Check Gradle version
        working-directory: project
        run: |
          gradle --version

      - name: Build Vibely APK
        working-directory: project
        run: |
          gradle clean assembleDebug --no-daemon

      - name: Upload Vibely APK
        uses: actions/upload-artifact@v4
        with:
          name: Vibely-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
